<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="MarcelOS 96 — Marcel Masllorens' 3D portfolio, imagined as a late-1990s desktop operating system.">
<title>MarcelOS 96 — Marcel Masllorens</title>
<style>
:root{--face:#c0c0c0;--navy:#15265e;--orange:#ffae7e;--bar1:#0a1a5c;--bar2:#2b6fd1;--ui:Tahoma,Verdana,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;font:12px/1.45 var(--ui);color:#000;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#0000c8}

/* Bevels */
.raised{background:var(--face);border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px #808080,inset 1px 1px #dfdfdf}
.sunken{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px #404040}
.btn{background:var(--face);border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px #808080;padding:3px 10px;text-decoration:none;color:#000;display:inline-block}
.btn:active,.btn.on{border-color:#404040 #fff #fff #404040;box-shadow:inset 1px 1px #808080}

/* Boot */
#boot{position:fixed;inset:0;z-index:9999;background:#000;color:#eee8ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;transition:opacity .6s;font-family:"Courier New",monospace}
#boot.off{opacity:0;pointer-events:none}
#boot h1{font-size:clamp(28px,6vw,56px);letter-spacing:4px}
#boot h1 b{color:var(--orange)}
#boot .bar{width:min(260px,70vw);height:14px;padding:2px}
#boot .bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#2b6fd1 0 10px,transparent 10px 13px);animation:load 1.5s steps(14) forwards}
@keyframes load{to{width:100%}}

/* Desktop */
#desktop{position:fixed;inset:0 0 40px 0;overflow:hidden;
 background:radial-gradient(ellipse at 78% 82%,rgba(255,174,126,.38),transparent 55%),radial-gradient(ellipse at 15% 10%,rgba(60,110,220,.35),transparent 50%),linear-gradient(145deg,#0e1a4a,var(--navy) 55%,#0b1340)}
#desktop::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 80px,rgba(255,255,255,.025) 81px 82px)}
#mark{position:absolute;right:28px;bottom:22px;text-align:right;color:rgba(238,232,255,.9);font:900 clamp(34px,6vw,76px)/.9 "Arial Narrow","Impact",sans-serif;letter-spacing:-1px;pointer-events:none;text-transform:uppercase}
#mark small{display:block;font:11px var(--ui);letter-spacing:3px;opacity:.7;margin-top:8px}
#icons{position:absolute;inset:10px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,92px);grid-auto-columns:92px;justify-content:start;align-content:start}
.ico{background:none;border:0;width:88px;height:88px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;text-shadow:1px 1px #000}
.ico span{font-size:34px;line-height:1;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.45))}
.ico em{font-style:normal;padding:0 3px;text-align:center}
.ico.sel em,.ico:focus-visible em{background:#000080;outline:1px dotted #fff}

/* Windows */
.win{position:absolute;display:flex;flex-direction:column;padding:2px;max-width:calc(100vw - 12px);max-height:calc(100% - 8px);box-shadow:inset -1px -1px #808080,inset 1px 1px #dfdfdf,4px 4px 0 rgba(0,0,0,.35)}
.win.min{display:none}
.win.max{inset:0!important;width:auto!important;height:auto!important;max-width:none;max-height:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:3px 3px 3px 6px;color:#cfd6ee;background:linear-gradient(90deg,#808080,#a8a8a8);font-weight:700;user-select:none;touch-action:none;cursor:default}
.win.active .bar{color:#fff;background:linear-gradient(90deg,var(--bar1),var(--bar2))}
.ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;gap:2px;flex:none}
.ctl .btn{padding:0;width:18px;height:16px;line-height:11px;font-size:11px;text-align:center}
.body{flex:1;overflow:auto;margin-top:3px;padding:14px;line-height:1.55}
.status{margin-top:3px;padding:2px 6px;font-size:11px;border:1px solid;border-color:#808080 #fff #fff #808080}

/* Window content */
.body h2{font:900 30px/.95 "Arial Narrow",Impact,sans-serif;text-transform:uppercase;color:var(--navy);margin-bottom:8px}
.body h3{font-size:13px;margin:12px 0 4px;color:var(--navy);text-transform:uppercase;letter-spacing:1px}
.body p+p{margin-top:8px}
.tag{display:inline-block;background:var(--navy);color:var(--orange);padding:1px 6px;font-size:10px;letter-spacing:1px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.card{display:flex;flex-direction:column;gap:6px;padding:8px;text-decoration:none;color:#000;text-align:left;border:2px solid;border-color:#fff #404040 #404040 #fff;background:var(--face)}
.card:hover{outline:2px solid var(--orange)}
.card .pic{aspect-ratio:4/3;background:linear-gradient(135deg,#344477,#17234d);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--orange);font-weight:700;text-align:center;padding:4px}
.card .pic img{width:100%;height:100%;object-fit:contain}
.card.cover .pic img{object-fit:cover}
.card b{text-transform:uppercase;letter-spacing:1px}
.card.dim{opacity:.6;cursor:default}
.frame{aspect-ratio:16/9;width:100%;border:0;background:#000}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* Start menu + taskbar */
#start{position:fixed;left:2px;bottom:38px;z-index:5000;width:220px;display:none;padding:3px}
#start.open{display:flex}
#start .side{width:26px;background:linear-gradient(0deg,var(--bar1),var(--bar2));color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);font:900 17px var(--ui);letter-spacing:1px;text-align:left;padding:6px 4px}
#start .side b{color:var(--orange)}
#start ul{flex:1;list-style:none}
#start button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:7px 10px;text-align:left;font-size:13px}
#start button:hover,#start button:focus-visible{background:#000080;color:#fff}
#start hr{border:0;border-top:1px solid #808080;border-bottom:1px solid #fff;margin:3px 2px}
#taskbar{position:fixed;left:0;right:0;bottom:0;height:40px;z-index:6000;display:flex;align-items:center;gap:4px;padding:3px 4px calc(3px + env(safe-area-inset-bottom));border-width:2px 0 0;border-color:#fff}
#sbtn{font-weight:700;display:flex;align-items:center;gap:6px;padding:2px 10px;height:100%}
#tasks{flex:1;display:flex;gap:4px;height:100%;overflow:hidden}
.task{flex:0 1 150px;min-width:36px;height:100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
#tray{height:100%;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid;border-color:#808080 #fff #fff #808080;font-size:11px}

@media (max-width:720px){
 .win{inset:0!important;width:auto!important;height:auto!important;max-width:none;max-height:none}
 .ctl [data-a=max]{display:none}
 .task{flex:1 1 0}
 #sbtn span{display:none}
 #mark{display:none}
}
@media (prefers-reduced-motion:reduce){#boot,#boot .bar i{animation:none;transition:none}#boot .bar i{width:100%}}
</style>
</head>
<body>

<div id="boot" role="status">
  <h1>MARCEL<b>OS</b> 96</h1>
  <div class="sunken bar"><i></i></div>
  <p>Starting Marcel's portfolio…</p>
</div>

<main id="desktop">
  <div id="icons" role="list"></div>
  <div id="mark">Marcel<br>Masllorens<small>3D GENERALIST · ARTIST · PORTFOLIO 2026</small></div>
</main>

<div id="start" class="raised" role="menu" aria-label="Start menu">
  <div class="side">Marcel<b>OS</b> 96</div>
  <ul id="menu"></ul>
</div>

<footer id="taskbar" class="raised">
  <button id="sbtn" class="btn" aria-haspopup="true" aria-expanded="false"><span>▦</span> Start</button>
  <div id="tasks"></div>
  <div id="tray" aria-live="off"><span title="3D">◆</span><time id="clock"></time></div>
</footer>

<script>
const $ = (s, r = document) => r.querySelector(s);
const pic = (src, alt) => `<img src="${src}" alt="${alt}" loading="lazy" onerror="this.remove()">`;

/* ---------- Content (edit freely) ---------- */
const MAIL = "masllorensmarcel@gmail.com";
const open = id => `data-open="${id}"`;

const APPS = {
  about: { title: "Readme.txt", icon: "📄", w: 420, h: 360, status: "Welcome to MarcelOS 96",
    html: `<span class="tag">3D GENERALIST · ARTIST</span>
      <h2>Hello, I'm Marcel.</h2>
      <p>I'm a 3D Generalist passionate about creating characters, digital worlds and visual experiences.</p>
      <p>This portfolio is a tiny operating system: double-click the icons on the desktop (or tap them on a phone), drag the windows around, and explore.</p>
      <div class="row">
        <button class="btn" ${open("projects")}>▶ Featured projects</button>
        <button class="btn" ${open("showreel")}>▶ Watch the showreel</button>
        <button class="btn" ${open("contact")}>▶ Get in touch</button>
      </div>` },

  work: { title: "My Work", icon: "🗂️", w: 520, h: 420, status: "4 object(s)",
    html: `<span class="tag">01 / WHAT I DO</span><h2>My Work</h2>
      <p>Exploring different areas of 3D art, visual effects and storytelling.</p>
      <h3>Areas of interest</h3>
      <div class="grid">
        ${[["3D Modeling","3D%20Modeling.jpg"],["Texturing","Texturing.png"],["VFX","VFX.png"],["Screen Writing","ScreenWriter.png"]]
          .map(([n, f]) => `<div class="card cover"><div class="pic">${pic("images/my-work/" + f, n)}${n}</div><b>${n}</b></div>`).join("")}
      </div>` },

  projects: { title: "Featured Projects", icon: "💾", w: 540, h: 440, status: "2 project(s) · 1 coming soon",
    html: `<span class="tag">02 / SELECTED WORK</span><h2>Featured Projects</h2>
      <div class="grid">
        <a class="card" href="storage-article.html"><div class="pic">${pic("images/my-work/Storage.png", "Storage")}Storage</div>
          <small>01 / CHARACTER DESIGN</small><b>Storage</b><span>My own original 3D avatar, from the first sculpt to the final render.</span><u>Read article ↗</u></a>
        <a class="card" href="endoskeleton-article.html"><div class="pic">${pic("images/my-work/Endoskeleton.jpg", "Endoskeleton")}Endoskeleton</div>
          <small>02 / 3D MODELING</small><b>Endoskeleton</b><span>The most accurate cosplay possible: prototypes and mechanics of an animatronic project.</span><u>Read article ↗</u></a>
        <div class="card dim"><div class="pic">?</div><small>03 / FUTURE PROJECTS</small><b>What's to come?</b><span>My future plans.</span><u>Coming soon</u></div>
      </div>` },

  skills: { title: "Skills & Tools", icon: "🛠️", w: 480, h: 380, status: "5 program(s) installed",
    html: `<span class="tag">03 / SOFTWARE</span><h2>Skills &amp; Tools</h2>
      <p>Software I use for 3D modelling, sculpting, visual effects and digital creation.</p>
      <div class="grid">
        ${[["ZBrush","zbrush_logo.png"],["Houdini","Houdini3D_icon.png"],["Adobe","adobe_Logopng.webp"],["Maya","MayaLogo.webp"],["Blender","Blender_logo.webp"]]
          .map(([n, f]) => `<div class="card"><div class="pic">${pic("images/SkillsAndTools/" + f, n)}${n}</div><b>${n}</b></div>`).join("")}
      </div>` },

  showreel: { title: "Showreel.avi", icon: "🎞️", w: 640, h: 470, status: "Selected moments",
    html: `<span class="tag">04 / SELECTED MOMENTS</span>
      <iframe class="frame" title="Marcel's 3D showreel" loading="lazy" allow="autoplay; fullscreen" allowfullscreen
        src="https://drive.google.com/file/d/1UM5P2we0xHZW5hI3nIM3mOaQKzRzh0UZ/preview"></iframe>
      <p>A selection of my work in 3D modelling, texturing, animation and visual development.</p>` },

  articles: { title: "Articles", icon: "📰", w: 480, h: 360, status: "2 article(s)",
    html: `<span class="tag">05 / BEHIND THE PROJECTS</span><h2>Articles</h2>
      <p>A closer look at the process, challenges and decisions behind my projects.</p>
      <div class="grid">
        <a class="card" href="storage-article.html"><small>01 / CHARACTER CREATION</small><b>Storage</b><span>Modelling, retopology, texturing, rigging and the challenges along the way.</span><u>Read article ↗</u></a>
        <a class="card" href="endoskeleton-article.html"><small>02 / PROTOTYPING</small><b>Endoskeleton</b><span>Designing and building a functional animatronic endoskeleton for a cosplay project.</span><u>Read article ↗</u></a>
      </div>` },

  contact: { title: "Contact", icon: "✉️", w: 440, h: 360, status: "Let's work together",
    html: `<span class="tag">06 / GET IN TOUCH</span><h2>Contacts</h2>
      <p>Interested in working together or knowing more about my work? Feel free to reach out.</p>
      <div class="grid">
        <a class="card" href="https://drive.google.com/file/d/1JKhZNZFIIH0lB_YSxcbVJjSnVB1vyITM/view?usp=sharing" target="_blank" rel="noopener noreferrer"><small>CURRICULUM VITAE</small><b>My CV</b><span>Experience, education and skills.</span></a>
        <a class="card" href="mailto:${MAIL}"><small>EMAIL</small><b>Get in touch</b><span>${MAIL}</span></a>
        <a class="card" href="https://www.linkedin.com/in/marcelmasllorens" target="_blank" rel="noopener noreferrer"><small>LINKEDIN</small><b>Let's connect</b><span>My professional profile.</span></a>
      </div>` }
};

/* ---------- Desktop icons + Start menu ---------- */
const coarse = matchMedia("(pointer:coarse)").matches;
const ICON_LABELS = { about: "Readme.txt", work: "My Work", projects: "Projects", skills: "Skills & Tools", showreel: "Showreel", articles: "Articles", contact: "Contact" };

$("#icons").innerHTML = Object.keys(APPS).map(id =>
  `<button class="ico" role="listitem" data-id="${id}"><span>${APPS[id].icon}</span><em>${ICON_LABELS[id]}</em></button>`).join("");

$("#menu").innerHTML = Object.keys(APPS).map(id =>
  `<li><button role="menuitem" data-open="${id}"><span>${APPS[id].icon}</span>${ICON_LABELS[id]}</button></li>`).join("") +
  `<li><hr></li><li><button role="menuitem" id="shut"><span>⏻</span>Shut Down…</button></li>`;

$("#icons").addEventListener("click", e => {
  const b = e.target.closest(".ico"); if (!b) return;
  document.querySelectorAll(".ico").forEach(i => i.classList.toggle("sel", i === b));
  if (coarse || e.detail === 0) openApp(b.dataset.id);   // tap or keyboard Enter
});
$("#icons").addEventListener("dblclick", e => { const b = e.target.closest(".ico"); if (b) openApp(b.dataset.id); });
$("#desktop").addEventListener("pointerdown", e => { if (!e.target.closest(".ico")) document.querySelectorAll(".ico.sel").forEach(i => i.classList.remove("sel")); });

document.addEventListener("click", e => {
  const o = e.target.closest("[data-open]"); if (o) { openApp(o.dataset.open); closeStart(); }
  if (!e.target.closest("#start, #sbtn")) closeStart();
});

/* ---------- Window manager ---------- */
let z = 10, cascade = 0;
const wins = {};

function openApp(id) {
  const a = APPS[id]; if (!a) return;
  let w = wins[id];
  if (w) { w.el.classList.remove("min"); return focusWin(id); }

  const el = document.createElement("section");
  el.className = "win raised";
  el.setAttribute("role", "dialog");
  el.setAttribute("aria-label", a.title);
  const x = Math.max(8, Math.min(innerWidth - a.w - 12, 130 + cascade * 28));
  const y = Math.max(8, Math.min(innerHeight - 40 - a.h - 8, 24 + cascade * 28));
  el.style.cssText = `width:${a.w}px;height:${a.h}px;left:${x}px;top:${y}px`;
  cascade = (cascade + 1) % 8;
  el.innerHTML = `<header class="bar"><span class="ttl">${a.icon} ${a.title}</span>
      <span class="ctl"><button class="btn" data-a="min" aria-label="Minimize">_</button><button class="btn" data-a="max" aria-label="Maximize">□</button><button class="btn" data-a="close" aria-label="Close">×</button></span></header>
    <div class="body sunken">${a.html}</div><footer class="status">${a.status}</footer>`;
  $("#desktop").appendChild(el);

  const task = document.createElement("button");
  task.className = "task btn";
  task.textContent = `${a.icon} ${a.title}`;
  $("#tasks").appendChild(task);

  wins[id] = { el, task };
  el.addEventListener("pointerdown", () => focusWin(id));
  task.addEventListener("click", () => {
    const hidden = el.classList.contains("min");
    if (!hidden && el.classList.contains("active")) el.classList.remove("active"), el.classList.add("min"), task.classList.remove("on");
    else { el.classList.remove("min"); focusWin(id); }
  });
  el.querySelector(".ctl").addEventListener("click", e => {
    const act = e.target.closest("[data-a]")?.dataset.a;
    if (act === "close") closeWin(id);
    if (act === "min") { el.classList.add("min", "x"); el.classList.remove("active"); task.classList.remove("on"); }
    if (act === "max") el.classList.toggle("max");
  });
  dragify(el);
  focusWin(id);
}

function focusWin(id) {
  Object.entries(wins).forEach(([k, w]) => {
    const on = k === id;
    w.el.classList.toggle("active", on);
    w.task.classList.toggle("on", on);
  });
  wins[id].el.style.zIndex = ++z;
}

function closeWin(id) {
  const w = wins[id]; if (!w) return;
  w.el.remove(); w.task.remove(); delete wins[id];
  const top = Object.keys(wins).pop(); if (top) focusWin(top);
}

function dragify(el) {
  const bar = el.querySelector(".bar");
  bar.addEventListener("pointerdown", e => {
    if (e.target.closest("button") || el.classList.contains("max") || innerWidth <= 720) return;
    const dx = e.clientX - el.offsetLeft, dy = e.clientY - el.offsetTop;
    bar.setPointerCapture(e.pointerId);
    const move = ev => {
      el.style.left = Math.max(-el.offsetWidth + 80, Math.min(innerWidth - 80, ev.clientX - dx)) + "px";
      el.style.top = Math.max(0, Math.min(innerHeight - 80, ev.clientY - dy)) + "px";
    };
    const up = () => { bar.removeEventListener("pointermove", move); bar.removeEventListener("pointerup", up); };
    bar.addEventListener("pointermove", move);
    bar.addEventListener("pointerup", up);
  });
  bar.addEventListener("dblclick", e => { if (!e.target.closest("button")) el.classList.toggle("max"); });
}

/* ---------- Start menu, clock, boot ---------- */
function closeStart() { $("#start").classList.remove("open"); $("#sbtn").classList.remove("on"); $("#sbtn").setAttribute("aria-expanded", "false"); }
$("#sbtn").addEventListener("click", () => {
  const o = $("#start").classList.toggle("open");
  $("#sbtn").classList.toggle("on", o); $("#sbtn").setAttribute("aria-expanded", o);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeStart(); });

$("#shut").addEventListener("click", () => {
  closeStart();
  Object.keys(wins).forEach(closeWin);
  const b = $("#boot");
  b.classList.remove("off");
  b.innerHTML = `<h1>It's now safe to<br>close this tab.</h1><p>(Click anywhere to restart MarcelOS 96)</p>`;
  b.style.pointerEvents = "auto";
  b.onclick = () => location.reload();
});

const tick = () => { $("#clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
tick(); setInterval(tick, 20000);

const bootEl = $("#boot");
const finishBoot = () => { if (bootEl.classList.contains("off")) return; bootEl.classList.add("off"); if (!Object.keys(wins).length) openApp("about"); };
setTimeout(finishBoot, 1700);
bootEl.addEventListener("click", finishBoot);
</script>
</body>
</html>
